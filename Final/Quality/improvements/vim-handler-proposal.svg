<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Proposed split of the Vim action handler and removal of an import cycle</title>
  <desc id="desc">Conceptual UML component diagram contrasting the current text buffer and Vim handler cycle with a proposed dispatcher, action-family handlers, and shared buffer operations. The proposal has not been implemented.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#274567"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: white; stroke: #cbd5e1; stroke-width: 2; }
      .component { fill: #eaf2ff; stroke: #274567; stroke-width: 2; }
      .shared { fill: #e7f5ef; stroke: #27735d; stroke-width: 2; }
      .heading { font: 700 25px Arial, sans-serif; fill: #142a43; }
      .subheading { font: 700 18px Arial, sans-serif; fill: #274567; }
      .name { font: 700 18px Arial, sans-serif; fill: #142a43; text-anchor: middle; }
      .detail { font: 14px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .label { font: 15px Arial, sans-serif; fill: #334155; }
      .note { font: 14px Arial, sans-serif; fill: #475569; }
      .edge { stroke: #274567; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .cycle { stroke: #b45345; stroke-width: 2.5; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="600"/>
  <text x="42" y="43" class="heading">Vim action handling: current and proposed module relationships</text>
  <rect x="28" y="70" width="552" height="455" rx="12" class="panel"/>
  <rect x="620" y="70" width="552" height="455" rx="12" class="panel"/>
  <text x="52" y="106" class="subheading">Current at v0.64.0</text>
  <text x="644" y="106" class="subheading">Proposed, not implemented</text>

  <rect x="92" y="171" width="202" height="89" rx="9" class="component"/>
  <text x="193" y="202" class="name">text-buffer.ts</text>
  <text x="193" y="227" class="detail">reducer + shared operations</text>
  <rect x="340" y="171" width="205" height="89" rx="9" class="component"/>
  <text x="442" y="202" class="name">vim-buffer-actions.ts</text>
  <text x="442" y="227" class="detail">handleVimAction()</text>
  <path d="M 294 199 L 339 199" class="edge"/>
  <path d="M 340 239 C 322 306, 280 306, 258 260" class="cycle"/>
  <text x="52" y="318" class="label">Both modules import from each other.</text>
  <text x="52" y="364" class="note">handleVimAction: 1,461 code lines,</text>
  <text x="52" y="387" class="note">cyclomatic complexity 196 (Understand Build 1264).</text>
  <text x="52" y="427" class="note">The dependency report also marks this link circular.</text>

  <rect x="642" y="143" width="222" height="75" rx="9" class="component"/>
  <text x="753" y="173" class="name">TextBufferReducer</text>
  <text x="753" y="198" class="detail">routes Vim actions</text>
  <rect x="921" y="143" width="222" height="75" rx="9" class="component"/>
  <text x="1032" y="173" class="name">VimDispatcher</text>
  <text x="1032" y="198" class="detail">chooses action family</text>
  <path d="M 864 181 L 920 181" class="edge"/>
  <path d="M 1032 218 L 1032 250" class="edge"/>
  <rect x="750" y="252" width="393" height="95" rx="9" class="component"/>
  <text x="946" y="281" class="name">Action-family handlers</text>
  <text x="946" y="306" class="detail">movement | delete/change | yank/paste | mode</text>
  <text x="946" y="328" class="detail">small cohesive functions, existing tests retained</text>
  <path d="M 946 347 L 946 383" class="edge"/>
  <rect x="793" y="385" width="305" height="74" rx="9" class="shared"/>
  <text x="946" y="415" class="name">BufferOperations</text>
  <text x="946" y="439" class="detail">extracted shared edit/motion helpers</text>
  <path d="M 745 218 L 745 422 L 792 422" class="edge"/>
  <text x="644" y="492" class="note">The shared module breaks the direct import cycle.</text>
  <text x="31" y="566" class="note">Conceptual component diagram drawn from text-buffer.ts, vim-buffer-actions.ts, their tests, and metric artifacts at commit 4a0749a.</text>
</svg>
